# Variante B : routage sélectif, runner optimisé après comparaison.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
multi_agent = true

[agents]
enabled = true
# Parallélisme conscient du palier : ne jamais lancer 4 agents chers en
# parallèle. Ce plafond vaut pour des sous-agents majoritairement Luna.
max_concurrent_threads_per_session = 4

# Si une délégation est utile : modèle bas par défaut, rôles chers explicites.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
